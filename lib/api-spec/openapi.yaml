openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Strategy Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: clients
  - name: strategies
  - name: calendar
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients with their latest strategy info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSummary"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client from minimal onboarding input
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{clientId}:
    parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client with onboarding profile and latest strategy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      responses:
        "204":
          description: Deleted

  /clients/{clientId}/strategy/generate:
    parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
    post:
      operationId: generateStrategy
      tags: [strategies]
      summary: Run enrichment + strategy generation pipeline
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateStrategyInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"

  /clients/{clientId}/strategy:
    parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
    patch:
      operationId: updateStrategy
      tags: [strategies]
      summary: Update strategy document and/or structured strategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStrategyInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"

  /clients/{clientId}/sow:
    parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
    put:
      operationId: updateSow
      tags: [clients]
      summary: Set or update the Statement of Work for a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Sow"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{clientId}/calendar:
    parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
    get:
      operationId: getCalendar
      tags: [calendar]
      summary: Get the planner and posts for a client
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarDetail"

  /clients/{clientId}/calendar/generate:
    parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
    post:
      operationId: generateCalendar
      tags: [calendar]
      summary: Build planner layer and generate a 30-day calendar from the strategy
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCalendarInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarDetail"

  /posts/{postId}:
    parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: string
    patch:
      operationId: updatePost
      tags: [calendar]
      summary: Update a calendar post (status, date, fields, comment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    CreateClientInput:
      type: object
      required: [name, websiteUrl, instagramHandle, oneLineDescription]
      properties:
        name: { type: string }
        websiteUrl: { type: string }
        instagramHandle: { type: string }
        oneLineDescription: { type: string }

    GenerateStrategyInput:
      type: object
      properties:
        templateType:
          type: string
          enum: [performance_marketing, brand_building, personal_brand, d2c_growth, auto]

    UpdateStrategyInput:
      type: object
      properties:
        strategyDocument:
          type: string
        structuredStrategy:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [draft, approved]

    Sow:
      type: object
      required: [platforms, monthlyPosts, contentMix, deliverables, toneByPlatform]
      properties:
        platforms:
          type: array
          items: { type: string }
          description: Active platforms (e.g. Instagram, LinkedIn, Pinterest, X, YouTube).
        monthlyPosts:
          type: object
          additionalProperties: { type: integer }
          description: "Posts per platform per month, e.g. { Instagram: 16, LinkedIn: 8 }."
        contentMix:
          type: object
          additionalProperties: { type: number }
          description: Pillar mix as percentages summing to 100.
        deliverables:
          type: array
          items: { type: string }
          description: Recurring deliverables (e.g. "1 monthly carousel", "weekly story takeover").
        toneByPlatform:
          type: object
          additionalProperties: { type: string }
          description: Voice/tone direction per platform.

    Client:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        website: { type: string, nullable: true }
        instagramHandle: { type: string, nullable: true }
        oneLineDescription: { type: string, nullable: true }
        sow:
          oneOf:
            - $ref: "#/components/schemas/Sow"
            - type: "null"
        createdAt: { type: string }

    ClientSummary:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          properties:
            hasStrategy: { type: boolean }
            templateType: { type: string, nullable: true }
            status: { type: string, nullable: true }

    EnrichedData:
      type: object
      properties:
        brand_name: { type: string }
        offer: { type: string }
        price_range: { type: string }
        business_model: { type: string }
        target_audience:
          type: object
          properties:
            who: { type: string }
            age_range: { type: string }
            stage: { type: string }
        brand_tone: { type: string }
        positioning: { type: string }
        platform: { type: string }
        content_preference: { type: string }
        competitors:
          type: array
          items: { type: string }

    OnboardingProfile:
      type: object
      required: [id, clientId, rawInput]
      properties:
        id: { type: string }
        clientId: { type: string }
        rawInput:
          type: object
          additionalProperties: true
        enrichedData:
          oneOf:
            - $ref: "#/components/schemas/EnrichedData"
            - type: "null"

    Strategy:
      type: object
      required: [id, clientId, structuredStrategy, strategyDocument, templateType, version, status]
      properties:
        id: { type: string }
        clientId: { type: string }
        structuredStrategy:
          type: object
          additionalProperties: true
        strategyDocument: { type: string }
        templateType: { type: string }
        version: { type: integer }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }

    ClientDetail:
      type: object
      required: [client]
      properties:
        client:
          $ref: "#/components/schemas/Client"
        onboarding:
          oneOf:
            - $ref: "#/components/schemas/OnboardingProfile"
            - type: "null"
        strategy:
          oneOf:
            - $ref: "#/components/schemas/Strategy"
            - type: "null"
        hasCalendar:
          type: boolean

    GenerateCalendarInput:
      type: object
      properties:
        month:
          type: string
          description: Month label (e.g. "May 2026"). Defaults to current month.
        startDate:
          type: string
          description: ISO date (YYYY-MM-DD). Defaults to first of the month.
        goal:
          type: string
          description: Single-sentence monthly goal (drives intent + KPIs).
        notes:
          type: string
          description: Free-text notes/constraints from the strategist for this month.

    Planner:
      type: object
      required: [id, clientId, distribution, formats, angleBank, hookStyles, weeklyFlow, pillars]
      properties:
        id: { type: string }
        clientId: { type: string }
        distribution:
          type: object
          additionalProperties: { type: number }
        formats:
          type: object
          additionalProperties: { type: number }
        platformSplit:
          type: object
          additionalProperties: { type: number }
          nullable: true
        angleBank:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        hookStyles:
          type: array
          items: { type: string }
        weeklyFlow:
          type: object
          additionalProperties: { type: string }
        pillars:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              color: { type: string }
              description: { type: string }
        kpis:
          type: object
          additionalProperties: { type: string }
          nullable: true
        phases:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              focus: { type: string }
          nullable: true
        month: { type: string, nullable: true }
        goal: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string }

    PostComment:
      type: object
      properties:
        author: { type: string }
        text: { type: string }
        createdAt: { type: string }

    PostExecution:
      type: object
      description: Format-specific execution detail. Shape depends on format.
      additionalProperties: true

    Post:
      type: object
      required: [id, clientId, plannerId, date, platform, pillar, angle, format, objective, hook, cta, status]
      properties:
        id: { type: string }
        clientId: { type: string }
        plannerId: { type: string }
        date: { type: string }
        platform: { type: string }
        pillar: { type: string }
        angle: { type: string }
        format: { type: string }
        objective: { type: string }
        hook: { type: string }
        caption: { type: string, nullable: true }
        hashtags:
          type: array
          items: { type: string }
          nullable: true
        cta: { type: string }
        strategicIntent: { type: string, nullable: true }
        expectedMetric: { type: string, nullable: true }
        expectedReason: { type: string, nullable: true }
        priority:
          type: string
          enum: [high, medium, low]
          nullable: true
        execution:
          oneOf:
            - $ref: "#/components/schemas/PostExecution"
            - type: "null"
        status:
          type: string
          enum: [draft, pending_approval, approved, needs_changes, scheduled, published]
        comments:
          type: array
          items:
            $ref: "#/components/schemas/PostComment"
        createdAt: { type: string }
        updatedAt: { type: string }

    UpdatePostInput:
      type: object
      properties:
        date: { type: string }
        status:
          type: string
          enum: [draft, pending_approval, approved, needs_changes, scheduled, published]
        hook: { type: string }
        caption: { type: string }
        hashtags:
          type: array
          items: { type: string }
        cta: { type: string }
        priority:
          type: string
          enum: [high, medium, low]
        addComment:
          type: object
          required: [text]
          properties:
            author: { type: string }
            text: { type: string }

    CalendarDetail:
      type: object
      properties:
        planner:
          oneOf:
            - $ref: "#/components/schemas/Planner"
            - type: "null"
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
