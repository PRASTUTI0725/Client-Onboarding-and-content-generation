kind = "web"
previewPath = "/"
title = "Strategy Engine"
version = "1.0.0"
id = "artifacts/strategy-engine"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25581

[services.development]
run = "pnpm --filter @workspace/strategy-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/strategy-engine", "run", "build" ]
publicDir = "artifacts/strategy-engine/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25581"
BASE_PATH = "/"
